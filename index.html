<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتيجة الترم الثاني – السنة الأولى 2026 م</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f7;--card:#fff;--ink:#1e1b22;--mute:#6b6773;--line:#e4e1e9;--brand:#4a1626;--gold:#c9a24b;--ok:#1f7a4d;--warn:#b26a00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141a;--card:#221e27;--ink:#f1eef4;--mute:#a49fae;--line:#35303c;--brand:#6a2036;--gold:#d8b25c;--ok:#52c88a;--warn:#e3a547;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#17141a;--card:#221e27;--ink:#f1eef4;--mute:#a49fae;--line:#35303c;--brand:#6a2036;--gold:#d8b25c;--ok:#52c88a;--warn:#e3a547;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--brand);color:#fff;padding:36px 20px 64px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800}
header p{margin:6px 0 0;opacity:.85}
main{max-width:760px;margin:-34px auto 40px;padding:0 14px}
.search{width:100%;padding:16px 18px;font:inherit;font-size:1.05rem;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.search:focus{outline:3px solid var(--gold);border-color:var(--gold)}
.count{color:var(--mute);margin:14px 4px 8px;font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;font:inherit;color:inherit;cursor:pointer;text-align:right}
.row:hover,.row:focus-visible{border-color:var(--gold);outline:none}
.nm{font-weight:600}
.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,10,16,.6)}
.dh{background:var(--brand);color:#fff;padding:20px;border-bottom:3px solid var(--gold)}
.dh h2{margin:0;font-size:1.3rem}
.dh small{opacity:.85}
.sub{padding:6px 18px}
.s{padding:11px 0;border-bottom:1px solid var(--line)}
.s:last-child{border:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.top b{font-weight:600}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.sum{display:flex;justify-content:space-between;padding:14px 18px;background:var(--bg);font-weight:800}
.close{display:block;width:calc(100% - 36px);margin:14px 18px 18px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:30px}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:0 16px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:22px}
label{display:block;font-weight:600;margin:0 0 6px}
.f{margin-bottom:16px}
.hint{color:var(--mute);font-size:.85rem;margin-top:4px}
.search{box-shadow:none;font-size:1.1rem;text-align:center;letter-spacing:1px}
.go,.close{display:block;width:100%;margin:6px 0 0;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.err{color:var(--bad);font-weight:600;margin-top:12px;min-height:1.5em}
.res{padding:0;overflow:hidden}
.res .close{width:calc(100% - 36px);margin:14px 18px 18px}
.res{background:var(--card)}
.hd{text-align:center;padding:26px 18px 18px;background:linear-gradient(180deg,var(--brand) 0,var(--brand) 55%,var(--card) 55%)}
.hd small{color:#fff;opacity:.85}
.hd h2{margin:2px 0 14px;color:#fff;font-size:1.35rem}
.ring{width:150px;height:150px;margin:0 auto;border-radius:50%;background:var(--card);padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);position:relative}
.ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.ring .n b{font-size:1.9rem;font-weight:800}
.ring .n span{font-size:.8rem;color:var(--mute)}
.stat{display:inline-block;margin-top:6px;padding:8px 22px;border-radius:99px;background:var(--card);font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px 4px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;border-top:4px solid var(--c)}
.tile .t{font-size:.85rem;color:var(--mute);min-height:2.6em;line-height:1.4}
.tile .v{font-size:1.5rem;font-weight:800;margin:2px 0 6px}
.tile .v small{font-size:.8rem;color:var(--mute);font-weight:400}
.chip{display:inline-block;padding:1px 12px;border-radius:99px;font-size:.8rem;font-weight:600;color:#fff;background:var(--c)}
.g0{--c:#1f7a4d}.g1{--c:#0f7b8a}.g2{--c:#2f5fc4}.g3{--c:#b26a00}.g4{--c:#b3261e}.gx{--c:#8a8693}
.acts{display:flex;gap:10px;padding:14px 16px 18px}
.acts button{flex:1;padding:13px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff}
.acts .alt{background:transparent;color:var(--ink);border-color:var(--line)}
@media print{header,.acts{display:none}body{background:#fff}}
.res .acts .close{width:auto;margin:0;font-size:1rem}
.logo{display:block;width:150px;max-width:50%;height:auto;margin:0 auto 14px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
header{text-wrap:balance}
.org{font-weight:800;font-size:clamp(1.05rem,4.2vw,1.35rem);color:var(--gold);line-height:1.5;margin-bottom:6px}
.org2{font-size:clamp(.95rem,3.8vw,1.1rem);font-weight:600;line-height:1.7;opacity:.95}
.sep{width:70px;height:3px;border-radius:3px;background:var(--gold);margin:16px auto 12px}
header h1{font-size:clamp(1.7rem,6.5vw,2.4rem);line-height:1.3}
.yr{margin-top:4px;font-size:1.05rem;font-weight:600;opacity:.9}
.logowrap{background:#fff;margin:-36px -20px 20px;padding:16px 0 8px;border-bottom:4px solid var(--gold)}
.logowrap .logo{width:190px;max-width:60%;margin:0 auto;filter:none}
header .logo{width:170px;max-width:55%;margin:0 auto 12px;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 8px rgba(255,255,255,.45))}
.org{white-space:nowrap;font-size:clamp(.75rem,3.7vw,1.35rem)}
body.res main{margin-top:24px}
.hd h2{margin-top:0}
html,body{height:auto;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
body.res main{margin:0 auto;padding:10px 10px 24px}
body.res .res{border-radius:14px}
.res .hd{padding:16px 14px 12px}
.res .hd h2{font-size:1.2rem;margin:0 0 10px}
.res .ring{width:112px;height:112px}
.res .ring .n b{font-size:1.5rem}
.res .grid{gap:8px;padding:6px 10px 2px}
.res .tile{padding:9px 10px}
.res .tile .t{min-height:2.2em;font-size:.8rem}
.res .tile .v{font-size:1.3rem;margin:0 0 4px}
.note{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));font-weight:600}
.note b{background:var(--c);color:#fff;padding:3px 16px;border-radius:99px;font-size:.95rem}
.overall{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;color:#fff;background:linear-gradient(135deg,var(--brand),#8a2b49);border-bottom:4px solid var(--gold);box-shadow:0 6px 18px rgba(74,22,38,.35)}
.overall small{display:block;color:var(--gold);font-weight:600;font-size:.85rem}
.overall b{font-size:1.7rem;font-weight:800;line-height:1.3}
.overall .pc{min-width:84px;text-align:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid var(--gold);font-size:1.3rem;font-weight:800}
.res .hd{background:var(--brand);border-bottom:4px solid var(--gold);padding:16px 14px}
.res .hd h2{margin:0}
.res .stat{margin-top:10px}
</style>
</head>

const SALT="NsAXYQNy5JCPUO5OGAh8ng==";
const T=145;
const dg=s=>s.replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[۰-۹]/g,x=>"۰۱۲۳۴۵۶۷۸۹".indexOf(x)).replace(/\D/g,"");
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function g(v,m){const t=m==20?[17,15,13,10]:m==15?[12,10,9,7]:[8,7,6,5];return v>=t[0]?"ممتاز":v>=t[1]?"جيد جدًا":v>=t[2]?"جيد":v>=t[3]?"مقبول":"ضعيف"}
async function open_(nid){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(nid),"PBKDF2",false,["deriveBits"]);
const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(SALT),iterations:100000,hash:"SHA-256"},km,384));
const tag=[...bits.slice(0,16)].map(x=>x.toString(16).padStart(2,"0")).join("");
const r=E.find(e=>e[0]==tag);if(!r)return null;
const k=await crypto.subtle.importKey("raw",bits.slice(16),"AES-GCM",false,["decrypt"]);
const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(r[1])},k,u8(r[2]));
return JSON.parse(new TextDecoder().decode(p))}catch(e){return null}}
const $=id=>document.getElementById(id);
async function go(){const nid=dg($("nid").value);$("err").textContent="";
if(nid.length!==14){$("err").textContent="الرقم القومي لازم يكون 14 رقم.";return}
$("go").disabled=true;$("go").textContent="جاري التحقق...";
const r=await open_(nid);$("go").disabled=false;$("go").textContent="عرض النتيجة";
if(!r){$("err").textContent="الرقم القومي غير مسجّل. راجع الرقم وحاول تاني، ولو مصرّ إنه صح كلّم المسؤول.";return}
show(r)}
function show(r){const v=r.slice(1,10),fl=r[10],ok=v.every(x=>typeof x==="number")&&!fl;
const gi=x=>["ممتاز","جيد جدًا","جيد","مقبول","ضعيف"].indexOf(x);
let h='<div class="hd"><h2></h2>';
if(false){const s=v.reduce((a,b)=>a+b,0),p=s/T*100,C=2*Math.PI*52;
h+='<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'"/></svg><div class="n"><b>'+p.toFixed(1)+'%</b></div></div>'}
else{const a=v.every(x=>x==="غ"||x===null)&&v.includes("غ"),t=fl?"بعد الإعادة":v.includes("ت")?"مؤجل":a?"غائب":"نتيجة غير مكتملة";}
h+='</div><div class="grid">';
S.forEach((s,j)=>{const x=v[j];let val,chip="",c="gx";
if(typeof x==="number"){val=x+' <small>/ '+s[1]+'</small>';const q=g(x,s[1]);c="g"+gi(q);chip='<span class="chip">'+q+'</span>'}
else val='<small>'+(x==="غ"?"غائب":x==="ت"?"مؤجل":"لم تُرصد")+'</small>';
h+='<div class="tile '+c+'"><div class="t">'+s[0]+'</div><div class="v">'+val+'</div>'+chip+'</div>'});
{const og=r[12],nums=v.filter(x=>typeof x==="number"),sm=nums.reduce((a,b)=>a+b,0);
const left=ok&&og?(sm/T*100).toFixed(1)+'%':'';
h+='<div class="overall"><div><small>التقدير العام</small><b>'+(fl?"بعد الإعادة":og||"—")+'</b></div>'+(left?'<div class="pc">'+left+'</div>':'')+'</div>'}
const nb=r[11];if(nb){h+='<div class="note '+(nb==="اجتاز"?"g0":"g4")+'"><span>✎ النوتة الروحية</span><b>'+(nb==="اجتاز"?"✓ ":"✕ ")+nb+'</b></div>'}
h+='</div><div style="height:16px"></div>';
const o=$("out");o.innerHTML=h;o.querySelector("h2").textContent=r[0];
document.querySelector("header").hidden=true;document.body.classList.add("res");$("login").hidden=true;o.hidden=false;window.scrollTo(0,0)}
$("go").onclick=go;["nid"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")go()}));
</script>
